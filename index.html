<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IdiotBox™ | BOX-0888</title>

    <!-- Ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 50px 15px 30px;
            background: #f4f4f4;
        }

        h1 {
            margin-bottom: 30px;
        }

        #controllerBox {
            background: white;
            width: 300px;
            max-width: calc(100% - 50px);
            margin: 0 auto 25px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        #controllerLabel {
            font-size: 18px;
            margin-bottom: 10px;
        }

        #blockchainLabel {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        #messageBox {
            width: 300px;
            max-width: calc(100% - 32px);
            margin: 0 auto 20px;
        }

        #messageLabel {
            display: block;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        #visitorMessage {
            box-sizing: border-box;
            width: 100%;
            min-height: 110px;
            padding: 12px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 10px;
            resize: vertical;
        }

        #characterCount {
            margin-top: 6px;
            text-align: right;
            color: #666;
            font-size: 12px;
        }

        button {
            display: block;
            width: 250px;
            max-width: 100%;
            padding: 20px;
            margin: 20px auto;
            font-size: 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #lockButton {
            background: #4CAF50;
            color: white;
        }

        #unlockButton {
            background: #f44336;
            color: white;
        }

        #resetButton {
            background: #2196F3;
            color: white;
            font-size: 16px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin: 30px auto 0;
            max-width: 500px;
            font-size: 18px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        #privacyNote {
            max-width: 450px;
            margin: 12px auto;
            color: #666;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <h1>IdiotBox™</h1>

    <div id="controllerBox">
        <div id="controllerLabel">IdiotBox Controller</div>

        <div id="blockchainLabel">
            Blockchain Command Control · Monad · BOX-0888
        </div>
    </div>

    <!-- WRITE WHAT YOU'RE WISHING FOR -->

    <div id="messageBox">

        <label id="messageLabel" for="visitorMessage">
            Write What You're Wishing For
        </label>

        <textarea
            id="visitorMessage"
            maxlength="280"
            placeholder="What are you wishing for? (Optional)"
            oninput="updateCharacterCount()"
        ></textarea>

        <div id="characterCount">0 / 280 characters</div>

    </div>

    <div id="privacyNote">
        Your wish will be recorded publicly on the blockchain.
        Do not enter passwords or private information.
    </div>

    <button id="connectButton" onclick="connectWallet()">
        CONNECT METAMASK
    </button>

    <button id="lockButton" onclick="sendLock()">
        LOCK
    </button>

    <button id="unlockButton" onclick="sendUnlock()">
        UNLOCK
    </button>

    <button id="resetButton" onclick="sendReset()">
        RESET_IDIOTBOX_WIFI
    </button>

    <div id="status">Ready.</div>

    <script>

        // ======================================================
        // IDIOTBOX SMART CONTRACT
        // ======================================================

        const contractAddress =
            "0xE3215339B0c8E1b6365E716d6C8B82cbaE0420e7";

        // Monad Mainnet chain ID
        const MONAD_CHAIN_ID = 143n;

        const contractABI = [
            "function lock(string message) public",
            "function unlock(string message) public",
            "function resetIdiotBoxWiFi() public",
            "event AuthorizationCommandIssued(uint256 indexed commandId, uint8 command, address indexed issuedBy)"
        ];


        // ======================================================
        // STATUS
        // ======================================================

        function updateStatus(message) {
            document.getElementById("status").innerText = message;
        }


        // ======================================================
        // CHARACTER COUNT
        // ======================================================

        function updateCharacterCount() {
            const message =
                document.getElementById("visitorMessage").value;

            document.getElementById("characterCount").innerText =
                message.length + " / 280 characters";
        }


        // ======================================================
        // GET WISH
        // ======================================================

        function getVisitorMessage() {
            return document
                .getElementById("visitorMessage")
                .value
                .trim();
        }


        // ======================================================
        // GET CONTRACT
        // ======================================================

        async function connectWallet() {
            try {
                await getContract();
                updateStatus("✅ Wallet connected to Monad Mainnet.");
            } catch (error) {
                console.error("Wallet connection error:", error);
            }
        }

        async function getContract() {

            if (!window.ethereum) {
                alert(
                    "No compatible wallet detected. Open this page in your wallet's browser or use a browser with a compatible wallet."
                );

                throw new Error("Wallet not detected.");
            }

            updateStatus("🦊 Connecting to wallet...");

            const provider =
                new ethers.BrowserProvider(window.ethereum);

            await provider.send("eth_requestAccounts", []);

            const network = await provider.getNetwork();

            if (network.chainId !== MONAD_CHAIN_ID) {

                updateStatus(
                    "🔴 Please switch your wallet to Monad Mainnet."
                );

                alert(
                    "Please switch your wallet to Monad Mainnet before continuing."
                );

                throw new Error("Wrong network. Expected Monad Mainnet.");
            }

            const signer = await provider.getSigner();

            return new ethers.Contract(
                contractAddress,
                contractABI,
                signer
            );
        }


        // ======================================================
        // LOCK
        // ======================================================

        async function sendLock() {

            const button = document.getElementById("lockButton");

            try {
                button.disabled = true;

                const contract = await getContract();
                const message = getVisitorMessage();

                updateStatus("🦊 Approve LOCK in your wallet...");

                const transaction = await contract.lock(message);

                console.log("LOCK transaction:", transaction.hash);

                updateStatus("⛓️ Waiting for Monad confirmation...");

                await transaction.wait();

                updateStatus("✅ LOCK confirmed on Monad!");

                document.getElementById("visitorMessage").value = "";
                updateCharacterCount();

            } catch (error) {
                console.error("LOCK error:", error);

                if (
                    error.code === 4001 ||
                    error.code === "ACTION_REJECTED"
                ) {
                    updateStatus("❌ Transaction cancelled");
                } else {
                    updateStatus(
                        "❌ LOCK failed. Check the network, contract address, and wallet."
                    );
                }

            } finally {
                button.disabled = false;
            }
        }


        // ======================================================
        // UNLOCK
        // ======================================================

        async function sendUnlock() {

            const button = document.getElementById("unlockButton");

            try {
                button.disabled = true;

                const contract = await getContract();
                const message = getVisitorMessage();

                updateStatus("🦊 Approve UNLOCK in your wallet...");

                const transaction = await contract.unlock(message);

                console.log("UNLOCK transaction:", transaction.hash);

                updateStatus("⛓️ Waiting for Monad confirmation...");

                await transaction.wait();

                updateStatus("✅ UNLOCK confirmed on Monad!");

                document.getElementById("visitorMessage").value = "";
                updateCharacterCount();

            } catch (error) {
                console.error("UNLOCK error:", error);

                if (
                    error.code === 4001 ||
                    error.code === "ACTION_REJECTED"
                ) {
                    updateStatus("❌ Transaction cancelled");
                } else {
                    updateStatus(
                        "❌ UNLOCK failed. Check the network, contract address, and wallet."
                    );
                }

            } finally {
                button.disabled = false;
            }
        }


        // ======================================================
        // RESET IDIOTBOX WIFI
        // ======================================================

        async function sendReset() {

            const confirmed = confirm(
                "RESET_IDIOTBOX_WIFI will erase the ESP32's saved Wi-Fi credentials and restart the IdiotBox.\n\nContinue?"
            );

            if (!confirmed) {
                updateStatus("Reset cancelled.");
                return;
            }

            const button = document.getElementById("resetButton");

            try {
                button.disabled = true;

                const contract = await getContract();

                updateStatus(
                    "🦊 Approve RESET_IDIOTBOX_WIFI in your wallet..."
                );

                const transaction =
                    await contract.resetIdiotBoxWiFi();

                console.log(
                    "RESET_IDIOTBOX_WIFI transaction:",
                    transaction.hash
                );

                updateStatus("⛓️ Waiting for Monad confirmation...");

                await transaction.wait();

                updateStatus(
                    "✅ RESET_IDIOTBOX_WIFI confirmed on Monad!"
                );

            } catch (error) {
                console.error("RESET_IDIOTBOX_WIFI error:", error);

                if (
                    error.code === 4001 ||
                    error.code === "ACTION_REJECTED"
                ) {
                    updateStatus("❌ Transaction cancelled");
                } else {
                    updateStatus(
                        "❌ RESET failed. Check the network, contract address, and wallet."
                    );
                }

            } finally {
                button.disabled = false;
            }
        }

    </script>

</body>
</html>
